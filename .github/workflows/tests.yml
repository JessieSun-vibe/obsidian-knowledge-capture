name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Douyin helper tests
        run: node tests/test_douyin_extension.js
      - name: Validate template JSON
        run: python -m json.tool web-clipper-templates/unified-source.json >/dev/null
